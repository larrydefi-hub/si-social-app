# Builds the SI SOCIAL Android app (and checks the iOS build) on GitHub's servers.
# Run it from GitHub → Actions → "Mobile apps" → Run workflow. The finished files appear under "Artifacts".
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       → a signed .aab for Google Play. Without them you get a debug .apk to install and test.
#   GOOGLE_SERVICES_JSON  → Firebase config for Android push notifications (the whole file's text).
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name shown in the store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      notes:
        description: 'What is new (shown to members in the "update the app" message)'
        required: false
        default: ''
      publish:
        description: 'Publish this Android app (sisocial.fun/download picks it up) and tell members to update'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create and configure the Android project
        run: npm run setup:android
      - name: Version
        run: |
          # Builds before this repository went up to 7, so numbers here start above that (updates must count up).
          sed -i "s/versionCode [0-9]*/versionCode $(( ${{ github.run_number }} + 100 ))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "Push enabled"; else echo "No GOOGLE_SERVICES_JSON secret: building without push"; fi
      - name: Sync
        run: npx cap sync android
      - name: Build signed release (.aab for Google Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Pasting on a phone can add spaces or line breaks to the long value: ignore them.
          # Accepts the long line on its own, or the whole SECRETS-README.txt pasted in (on a phone "Select all" is easiest):
          # the key is the long base64 line. Spaces and line breaks from pasting are ignored.
          K="$(printf '%s\n' "$KEYSTORE" | tr -d '\r' | grep -oE '[A-Za-z0-9+/=]{200,}' | awk '{ if (length($0) > length(k)) k = $0 } END { print k }')"
          [ -n "$K" ] || K="$(printf '%s' "$KEYSTORE" | tr -d ' \r\n\t')"
          printf '%s' "$K" | base64 -d > "$RUNNER_TEMP/release.keystore" || { echo "::error::ANDROID_KEYSTORE_BASE64 isn't complete. Copy the whole long line from SECRETS-README.txt again and update the secret."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null || { echo "::error::The key file opened but the password or alias doesn't match. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (it is: upload)."; exit 1; }
          npx cap build android --keystorepath "$RUNNER_TEMP/release.keystore" --keystorepass "$KS_PASS" --keystorealias "$KEY_ALIAS" --keystorealiaspass "$KEY_PASS" --androidreleasetype AAB
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" -alias "$KEY_ALIAS" | grep "SHA256:" | sed 's/.*SHA256: /ANDROID_CERT_SHA256 for Render: /'
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Build signed app for direct download (.apk)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Pasting on a phone can add spaces or line breaks to the long value: ignore them.
          # Accepts the long line on its own, or the whole SECRETS-README.txt pasted in (on a phone "Select all" is easiest):
          # the key is the long base64 line. Spaces and line breaks from pasting are ignored.
          K="$(printf '%s\n' "$KEYSTORE" | tr -d '\r' | grep -oE '[A-Za-z0-9+/=]{200,}' | awk '{ if (length($0) > length(k)) k = $0 } END { print k }')"
          [ -n "$K" ] || K="$(printf '%s' "$KEYSTORE" | tr -d ' \r\n\t')"
          printf '%s' "$K" | base64 -d > "$RUNNER_TEMP/release.keystore" || { echo "::error::ANDROID_KEYSTORE_BASE64 isn't complete. Copy the whole long line from SECRETS-README.txt again and update the secret."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null || { echo "::error::The key file opened but the password or alias doesn't match. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (it is: upload)."; exit 1; }
          npx cap build android --keystorepath "$RUNNER_TEMP/release.keystore" --keystorepass "$KS_PASS" --keystorealias "$KEY_ALIAS" --keystorealiaspass "$KEY_PASS" --androidreleasetype APK
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Build test app (.apk)
        if: env.HAS_KEYSTORE != 'true'
        run: cd android && ./gradlew assembleDebug
      - name: Publish the app (a GitHub release that sisocial.fun/download reads)
        if: inputs.publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          SIGNED: ${{ env.HAS_KEYSTORE }}
        run: |
          set -euo pipefail
          APK="$(ls mobile/android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)"
          [ -n "$APK" ] || APK="$(ls mobile/android/app/build/outputs/apk/debug/*.apk | head -1)"
          mkdir -p out
          cp "$APK" out/si-social.apk
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/si-social.apk"
          export APK_URL
          node -e 'const fs=require("fs");fs.writeFileSync("out/app.json",JSON.stringify({android:{version:process.env.VERSION,build:Number(process.env.GITHUB_RUN_NUMBER)+100,url:process.env.APK_URL,notes:process.env.NOTES||undefined,signed:process.env.SIGNED==="true",publishedAt:new Date().toISOString()}},null,2)+"\n")' 
          gh release create "$TAG" out/si-social.apk out/app.json --title "SI SOCIAL ${VERSION}" --notes "${NOTES:-SI SOCIAL Android app ${VERSION}}" --latest
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: si-social-android-${{ inputs.version }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create and configure the iOS project
        run: npm run setup:ios
      - name: Check it builds (simulator, unsigned)
        run: |
          npx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Package the Xcode project (open on a Mac to sign and send to TestFlight)
        run: tar -czf si-social-ios-project.tgz ios
      - uses: actions/upload-artifact@v4
        with:
          name: si-social-ios-project-${{ inputs.version }}
          path: mobile/si-social-ios-project.tgz
